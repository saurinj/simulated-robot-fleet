apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: fleet
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: ntfy
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/ntfy-url
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.30.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/data
          ports:
            - containerPort: 9093
              name: web
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /etc/alertmanager
              name: config
            - mountPath: /etc/alertmanager/secrets
              name: secrets
              readOnly: true
            - mountPath: /data
              name: data
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: alertmanager-ntfy
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: fleet
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: web
      protocol: TCP
      name: web
