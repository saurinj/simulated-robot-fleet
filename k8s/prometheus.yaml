# Prometheus: scrapes the bridge's :8001/metrics every 15s and stores the
# time series. Grafana (grafana.yaml) queries this — nothing talks to the
# bridge's metrics endpoint except Prometheus.
#
# Data lives on an emptyDir: fine for a local kind demo, gone on pod
# restart. For anything durable, swap in a PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'fleet-bridge'
        static_configs:
          - targets: ['bridge-metrics:8001']
  rules.yml: |
    groups:
      - name: fleet-bridge
        rules:
          - alert: BridgeDown
            expr: up{job="fleet-bridge"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Fleet bridge metrics endpoint unreachable"
          - alert: TelemetryDropping
            expr: rate(fleet_bridge_telemetry_dropped_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Bridge shedding telemetry (queue full)"
          - alert: TelemetryFailing
            expr: rate(fleet_bridge_telemetry_failed_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Bridge losing telemetry to Kafka errors"
          - alert: TelemetryStopped
            expr: sum(rate(fleet_bridge_telemetry_forwarded_total[2m])) == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "No telemetry flowing from bridge to Kafka"
          - alert: QueueBackingUp
            expr: fleet_bridge_queue_depth > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Bridge queue backing up (>1000 messages)"
          
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # The prom/prometheus image runs as nobody (65534); fsGroup makes the
      # emptyDir data volume writable for it. Without this, Prometheus
      # fails to start with a permission error on /prometheus.
      securityContext:
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v3.14.0
        imagePullPolicy: IfNotPresent
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=7d'
        ports:
        - name: web
          containerPort: 9090
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
  - name: web
    port: 9090
    targetPort: 9090
    protocol: TCP
